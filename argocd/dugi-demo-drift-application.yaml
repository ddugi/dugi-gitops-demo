apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dugi-demo-drift
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ddugi/dugi-gitops-demo.git
    targetRevision: HEAD
    path: k8s-drift
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Manual sync is intentional for the drift demonstration.
  # No automated policy or self-heal is enabled.
  syncPolicy: {}

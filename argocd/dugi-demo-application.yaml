apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dugi-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ddugi/dugi-gitops-demo.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Fully automated: Git changes are applied automatically and
  # manual changes in the cluster are reverted (self-heal).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
